<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f1e6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Kapa — Pocket and Horizon</title>
    <meta
      name="description"
      content="Kapa is two household money apps: Pocket, a monthly spending-cap tracker, and Horizon, a multi-currency cashflow projector."
    />
    <meta property="og:title" content="Kapa — Pocket and Horizon" />
    <meta
      property="og:description"
      content="Two household money apps: Pocket, a monthly spending-cap tracker, and Horizon, a multi-currency cashflow projector."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Kapa — Pocket and Horizon" />
    <meta
      name="twitter:description"
      content="Two household money apps: Pocket, a monthly spending-cap tracker, and Horizon, a multi-currency cashflow projector."
    />
    <script>
      // Runs before any CSS paints, so the correct theme's `--kapa-*` vars
      // are already selected by the time main.css resolves them — avoids a
      // flash of the default theme on reload. src/stores/theme.ts's init()
      // reads the same key to sync Pinia state to what's already applied.
      (function () {
        // The KAPA_THEME_IDS placeholder below is substituted by the
        // kapa-theme-css Vite plugin (vite.config.ts) from kapa-core's own
        // THEME_IDS, so a new theme added there doesn't need an edit here.
        var ids = %KAPA_THEME_IDS%;
        var stored = localStorage.getItem('kapa-theme');
        var theme = ids.indexOf(stored) !== -1 ? stored : ids[0];
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
